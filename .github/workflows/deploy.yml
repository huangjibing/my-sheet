name: Nuxt3 CI/CD to 宝塔
on:
  push:
    branches: [master]  # 仅main分支触发部署

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@master

      # 2. 设置Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # 4. 构建并推送Docker镜像
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/nuxt3-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      # 删除多余镜像只保留最新前五镜像
      - name: Cleanup old Docker images
        if: always()
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
          IMAGE_NAME: ${{ secrets.DOCKER_HUB_USERNAME }}/newvigorbuysheet
          KEEP_LAST: 5
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          # 获取Docker Hub认证令牌
          TOKEN=$(curl -s -H "Content-Type: application/json" -X POST -d '{"username":"'${DOCKER_HUB_USERNAME}'","password":"'${DOCKER_HUB_TOKEN}'"}' https://hub.docker.com/v2/users/login/ | jq -r .token)
          # 获取所有标签并删除旧的
          TAGS=$(curl -s -H "Authorization: JWT ${TOKEN}" https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/?page_size=100 | jq -r '.results | sort_by(.last_updated) | reverse | .[] | .name')
          COUNT=0
          for TAG in $TAGS; do
            if [ $COUNT -ge $KEEP_LAST ]; then
              curl -s -X DELETE -H "Authorization: JWT ${TOKEN}" https://hub.docker.com/v2/repositories/${IMAGE_NAME}/tags/${TAG}/
            fi
            COUNT=$((COUNT+1))
          done

      # 5. 部署到宝塔服务器（替换容器镜像，用docker run创建容器）
      - name: Deploy to 宝塔服务器
        id: deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_SSH_HOST }}  # 服务器IP
          username: ${{ secrets.SERVER_SSH_USER }}  # 服务器用户名（如root）
          key: ${{ secrets.SERVER_SSH_KEY }}  # SSH密钥
          port: ${{ secrets.SERVER_SSH_PORT }}  # SSH端口（默认22）
          script: |
            # 第一步：拉取最新镜像
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/nuxt3-app:latest
            
            # 第二步：定义容器名和网络（和原docker-compose配置一致）
            CONTAINER_NAME="vigorbuysheet-docker"
            NETWORK_NAME="nuxt-network-new"
            
            # 第三步：检查自定义网络是否存在，不存在则创建（和原配置的nuxt-network一致）
            if ! docker network ls --format "{{.Name}}" | grep -q "$NETWORK_NAME"; then
              docker network create --driver bridge $NETWORK_NAME
              echo "自定义网络 $NETWORK_NAME 创建成功"
            fi
            
            # 第四步：检查容器是否存在，存在则删除容器;
            if docker ps -a --format "{{.Names}}" | grep -q "$CONTAINER_NAME"; then
              # 容器存在：替换镜像并重启
              docker stop $CONTAINER_NAME
              docker rm $CONTAINER_NAME
              echo "容器 $CONTAINER_NAME 已经删除"
            fi
            
            # 第五步: 创建容器并设置镜像
              docker run -d \
                --name $CONTAINER_NAME \
                --restart always \
                --network $NETWORK_NAME \
                -p 3000:3000 \
                -e TZ=Asia/Shanghai \
                -e NUXT_HOST=0.0.0.0 \
                -e NUXT_PORT=3000 \
                ${{ secrets.DOCKER_HUB_USERNAME }}/nuxt3-app:latest
              echo "容器 $CONTAINER_NAME 已通过docker run创建并启动"
            
            # 第六步：清理无用镜像（节省空间）
            docker system prune -f

      # 6. 打包+部署成功后推送飞书通知（仅成功时执行）
      - name: Send Feishu Success Notification
        if: steps.deploy.outcome == 'success'  # 仅部署步骤成功时触发
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          REPO_NAME: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_ID: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
          SERVER_HOST: ${{ secrets.SERVER_SSH_HOST }}
          CONTAINER_NAME: "vigorbuysheet-docker"
          DOCKER_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/nuxt3-app:latest
          ACTION_LOG_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          SHORT_COMMIT_ID=$(echo $COMMIT_ID | cut -c1-7)
          DEPLOY_TIME=$(date +"%Y-%m-%d %H:%M:%S")
          
          FEISHU_MSG=$(cat << EOF
          {
            "msg_type": "post",
            "content": {
              "post": {
                "zh_cn": {
                  "title": "✅ Nuxt3 打包部署成功 | 宝塔服务器",
                  "content": [
                    [{"tag":"text","text":"📋 项目：${REPO_NAME}"}],
                    [{"tag":"text","text":"🌿 分支：${BRANCH_NAME}"}],
                    [{"tag":"text","text":"🔖 提交版本："},{"tag":"a","text":"${SHORT_COMMIT_ID}","href":"https://github.com/${REPO_NAME}/commit/${COMMIT_ID}"}],
                    [{"tag":"text","text":"✍️ 提交者：${COMMIT_AUTHOR} | 提交说明：${COMMIT_MSG}"}],
                    [{"tag":"text","text":"🖥️ 部署服务器：${SERVER_HOST}"}],
                    [{"tag":"text","text":"📦 容器名：${CONTAINER_NAME}"}],
                    [{"tag":"text","text":"🐳 镜像版本：${DOCKER_IMAGE}"}],
                    [{"tag":"text","text":"🕒 部署完成时间：${DEPLOY_TIME}"}],
                    [{"tag":"text","text":"📝 部署日志："},{"tag":"a","text":"查看GitHub Action日志","href":"${ACTION_LOG_URL}"}]
                  ]
                }
              }
            }
          }
          EOF
          )
          
          curl -X POST \
            -H "Content-Type: application/json" \
            -d "$FEISHU_MSG" \
            $FEISHU_WEBHOOK